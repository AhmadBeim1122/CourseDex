{% extends "base.html" %}
{% block breadcrumbs %}
<div class="breadcrumbs"><div class="wrap"><a href="{% url 'core:home' %}">Home</a><span class="sep">/</span><span class="current">Books</span></div></div>
{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap">
    <span class="eyebrow">Full Books</span>
    <h1>Books</h1>
    <p>Browse full subject books shared by the admin. Click any book to preview it — no download needed.</p>

    <form method="get" class="hero-search" style="max-width:480px; margin:1.5rem 0 2rem;"
          hx-get="{% url 'academics:book_browse_partial' %}" hx-target="#book-grid-container" hx-swap="innerHTML" hx-trigger="input changed delay:350ms from:input, submit">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" name="q" value="{{ query }}" placeholder="Search books by subject name…">
      </div>
    </form>

    <div id="book-grid-container" class="topic-browse-grid">
      {% include "partials/book_grid_items.html" %}
    </div>
  </div>
</section>
{% endblock %}
