{% extends "base.html" %}
{% block breadcrumbs %}
<div class="breadcrumbs"><div class="wrap"><a href="{% url 'core:home' %}">Home</a><span class="sep">/</span><span class="current">Past Papers</span></div></div>
{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div>
        <span class="eyebrow">Past Papers</span>
        <h1>Browse by program</h1>
        <p>Pick a program to find solved past papers, organized by semester, subject and year.</p>
      </div>
    </div>

    <form method="get" class="hero-search" style="max-width:420px; margin-bottom:2rem;"
          hx-get="{% url 'academics:pastpaper_program_list' %}" hx-target="#program-grid" hx-push-url="true" hx-trigger="input changed delay:300ms from:input, submit">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" name="q" value="{{ query }}" placeholder="Search programs…">
      </div>
    </form>

    <div id="program-grid">
      {% include "partials/program_grid.html" %}
    </div>
  </div>
</section>
{% endblock %}
