{% load static %}
<form id="contact-form" method="post" action="{% url 'core:contact' %}"
      hx-post="{% url 'core:contact' %}" hx-target="#contact-form-wrap" hx-swap="innerHTML">
  {% csrf_token %}
  <div class="field">
    <label for="{{ form.name.id_for_label }}">Name</label>
    {{ form.name }}
    {{ form.name.errors }}
  </div>
  <div class="field">
    <label for="{{ form.email.id_for_label }}">Email</label>
    {{ form.email }}
    {{ form.email.errors }}
  </div>
  <div class="field">
    <label for="{{ form.subject.id_for_label }}">Subject</label>
    {{ form.subject }}
    {{ form.subject.errors }}
  </div>
  <div class="field">
    <label for="{{ form.message.id_for_label }}">Message</label>
    {{ form.message }}
    {{ form.message.errors }}
  </div>
  <button type="submit" class="btn btn-amber">Send message</button>
</form>
